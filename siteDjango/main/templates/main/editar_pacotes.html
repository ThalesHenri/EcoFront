{% extends "main/base.html" %}
{% block title %}Editar Pacote - FoodZip{% endblock title %}
{% block content %}
<div class="dashboard fade-in">
    <div class="dashboard-header">
        <h1>Editar Pacote</h1>
        <p>Atualize as informações do seu pacote</p>
    </div>
    <div class="form-container">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label for="nome_pacote">Nome do Pacote:</label>
                <input type="text" id="nome_pacote" name="nome_pacote" value="{{ pacote.nome_pacote }}" required>
            </div>
            <div class="form-group">
                <label for="descricao">Descrição:</label>
                <textarea id="descricao" name="descricao" required>{{ pacote.descricao }}</textarea>
            </div>
            <div class="form-group">
                <label for="preco">Preço:</label>
                <input type="number" step="0.01" id="preco" name="preco" value="{{ pacote.preco }}" required>
            </div>
            <div class="form-group">
                <label for="quant_disponivel">Quantidade Disponível:</label>
                <input type="number" id="quant_disponivel" name="quant_disponivel" value="{{ pacote.quant_disponivel }}" required>
            </div>
            <div class="form-group">
                <label for="categoria">Categoria:</label>
                <input type="text" id="categoria" name="categoria" value="{{ pacote.categoria }}" required>
            </div>
            <div class="form-group">
                <label for="imagem">Imagem:</label>
                <input type="file" id="imagem" name="imagem">
                {% if pacote.imagem %}
                    <img src="{{ pacote.imagem }}" alt="Imagem do Pacote" class="img-preview">
                {% endif %}
            </div>
            <button type="submit" class="btn-primary">Salvar Alterações</button>
        </form>
    </div>        
{% endblock content %}

{% extends "main/base.html" %}

{% block title %}Cadastrar Pacote - EcoSertão{% endblock %}

{% block content %}
<div class="form-container fade-in">
    <form method="post" class="form-box">
        {% csrf_token %}
        <h2>Cadastrar Novo Pacote</h2>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        
        <div class="form-group">
            <label for="nome_pacote">Nome do Pacote:</label>
            <input type="text" name="nome_pacote" id="nome_pacote" required>
        </div>
        
        <div class="form-group">
            <label for="categoria">Categoria:</label>
            <select name="categoria" id="categoria" required>
                <option value="">Selecione uma categoria</option>
                <option value="Salgada">Salgada</option>
                <option value="Doce">Doce</option>
                <option value="Mista">Mista</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="preco">Preço (R$):</label>
            <input type="number" name="preco" id="preco" step="0.01" min="0" required>
        </div>
        
        <div class="form-group">
            <label for="quant_disponivel">Quantidade Disponível:</label>
            <input type="number" name="quant_disponivel" id="quant_disponivel" min="1" required>
        </div>
        
        <div class="form-group">
            <label for="descricao">Descrição:</label>
            <textarea name="descricao" id="descricao" rows="4" required></textarea>
        </div>
        
        <button type="submit" class="btn-submit">Cadastrar Pacote</button>
        
        <div class="form-links">
            <a href="{% url 'dashboard_vendedor' %}">Voltar ao Dashboard</a>
        </div>
    </form>
</div>
{% endblock content %}
